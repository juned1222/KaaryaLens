<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Rounded cream icon base -->
  <rect width="120" height="120" rx="26" fill="#FAF8F5" stroke="#E2E8F0" stroke-width="1.5"/>
  
  <!-- Devanagari character 'क' in Primary Navy #0F172A -->
  <g fill="#0F172A">
    <!-- Shirorekha (Top horizontal headline bar) -->
    <rect x="28" y="44" width="46" height="6.5" rx="2"/>
    <!-- Vertical backbone stem -->
    <rect x="47.5" y="44" width="7" height="42" rx="2"/>
    <!-- Left loop of 'क' -->
    <path d="M49 52 C35 52, 30 63, 30 70 C30 77.5, 36.5 83, 49 83 Z" 
          fill="none" stroke="#0F172A" stroke-width="6.5" stroke-linejoin="round"/>
    <!-- Right curve/tail of 'क' -->
    <path d="M53 58 C62 58, 68 64, 68 73 C68 79, 64 85, 59 88" 
          fill="none" stroke="#0F172A" stroke-width="6.5" stroke-linecap="round"/>
  </g>

  <!-- Accent Orange upward lens angle / compass corner marker (North-East Growth) -->
  <path d="M68 35 H90 V57" fill="none" stroke="#F59E0B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
